# ============================================================
# Gradle Settings
# ============================================================

# Default memory for Gradle (can be overridden per command)
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Disable configuration cache (not compatible with NeoForge launcher scripts yet)
org.gradle.configuration-cache=false

# Use the Windows certificate store so Gradle/NeoGradle can trust local TLS interception roots.
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT

# ============================================================
# Parchment Mappings
# ============================================================

# See https://parchmentmc.org/docs/getting-started
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# ============================================================
# Environment Properties
# ============================================================

# Minecraft version must agree with Neo version
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]

# NeoForge version
neo_version=21.1.240

# Loader version range (major FML version only)
loader_version_range=[1,)

# ============================================================
# Mod Properties
# ============================================================

# Unique mod identifier
mod_id=aura

# Human-readable display name
mod_name=Aura: Skills and abilities

# License
mod_license=All Rights Reserved

# Semantic version
mod_version=1.21.1-neo-5

# Group ID
mod_group_id=net.revilodev.aura

# Authors
mod_authors=ReviloDev

# Mod description
mod_description=Aura is a progression RPG mod built around skills + abilities. You level up through gameplay, earn points, and build your character with passive stat upgrades and active combat abilities, all managed through an in-inventory panel and a dedicated skill book UI.
